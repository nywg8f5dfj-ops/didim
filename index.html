<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>디딤 사상체질 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{--paper:#F5F3EC;--ink:#141414;--green:#1E4B2E;--lime:#EEF5CC;--line:#DCD9CD;--muted:#6B6E63}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 28px 64px}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:.02em}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
  .kicker{font-size:12px;color:var(--green);text-transform:uppercase}
  .langsel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  select,input{font:inherit;font-size:15px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%}
  .langsel select{width:auto;padding:8px 10px;font-size:14px}
  h1{font-size:clamp(32px,4.6vw,54px);line-height:1.12;margin:0 0 12px;font-weight:900;color:var(--green);letter-spacing:-.02em}
  header p{max-width:720px;color:var(--muted);line-height:1.7;margin:0 0 30px;font-size:17px}
  .lab{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start}
  .stage{position:relative}
  .frame{position:relative;border:1px solid var(--line);background:var(--paper);aspect-ratio:1/1;overflow:hidden}
  .frame canvas{display:block;width:100%;height:100%}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none;background:#111}
  .guide{position:absolute;inset:14%;border:2px dashed rgba(255,255,255,.75);border-radius:46% 46% 42% 42%;display:none;pointer-events:none}
  .count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:140px;font-weight:900;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.35)}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
  .phase{position:absolute;inset-inline-start:12px;top:12px;font-size:11px;background:var(--ink);color:#fff;padding:5px 9px;border-radius:99px;z-index:2}
  .panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;min-height:440px;display:flex;flex-direction:column}
  .panel .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .prog{height:4px;background:#eee;border-radius:99px;margin:12px 0 22px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--green);transition:width .6s ease}
  .panel h3{font-size:22px;line-height:1.4;margin:0 0 16px;letter-spacing:-.01em}
  .note{font-size:14px;color:var(--muted);line-height:1.7;margin:0}
  .form{display:grid;gap:14px;margin:4px 0 12px}
  .form label{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
  .form .two{display:grid;grid-template-columns:2fr 1fr;gap:12px}
  .err{color:#b4441a;font-size:13px;min-height:18px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opts button,.btn{font:inherit;font-size:15px;text-align:start;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--paper);cursor:pointer;transition:all .15s;color:var(--ink)}
  .opts button:hover{border-color:var(--green);background:var(--lime)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:18px}
  .btn{display:inline-flex;align-items:center;gap:6px;text-align:center}
  .btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.4;cursor:default}
  .loading{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .loading h3{margin:0}
  .spin{width:20px;height:20px;border-radius:50%;border:3px solid #dfe8e1;border-top-color:var(--green);animation:sp .8s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .why{background:var(--lime);border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.65;margin:0 0 18px;color:#2f3a29}
  .why b{color:var(--green);margin-inline-end:6px}
  .steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--muted)}
  .steps li{display:flex;gap:10px;align-items:center}
  .steps li i{width:18px;height:18px;border-radius:50%;border:2px solid #cfd3c8;flex:none;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;color:#fff}
  .steps li.done{color:var(--ink)} .steps li.done i{background:var(--green);border-color:var(--green)}
  .steps li.now{color:var(--green);font-weight:700} .steps li.now i{border-color:var(--green);border-top-color:transparent;animation:sp .8s linear infinite}
  .warn{background:#fff4e8;border:1px solid #f3d7b5;color:#7a4a12;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6;margin-bottom:14px}
  .shares{margin-top:14px}
  .srow{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;font-size:12.5px;margin:6px 0}
  .srow .t{height:8px;background:#e8e5da;border-radius:99px;overflow:hidden}
  .srow .t i{display:block;height:100%;transition:width .35s}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px;vertical-align:1px}
  .bar{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:8px;background:#e8e5da}
  .bar i{display:block;height:100%}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:6px}
  .result-card{border-radius:16px;padding:20px 22px;margin:4px 0 14px}
  .result-card .k{font-size:12px;color:var(--green)}
  .result-card h3{margin:6px 0 6px;font-size:25px}
  .result-card p{margin:0;font-size:15px;line-height:1.6;color:#33392d}
  .stars{font-size:15px;letter-spacing:2px;margin-top:8px;color:var(--green)}
  footer{margin-top:34px;font-size:12.5px;color:var(--muted);line-height:1.7}
  /* profile card */
  .cardwrap{display:none;justify-content:center}
  .pcard{width:100%;max-width:470px;background:#fff;border-radius:6px;padding:14px 14px 18px;box-shadow:0 18px 50px rgba(20,20,20,.12);direction:ltr}
  .pc-vis{position:relative;aspect-ratio:1/1.02;border-radius:22px;overflow:hidden;touch-action:none;cursor:grab}
  .pc-vis:active{cursor:grabbing}
  .pc-vis canvas{display:block;width:100%!important;height:100%!important}
  .pc-tab{position:absolute;left:0;top:0;background:#fff;padding:8px 18px 10px 10px;border-bottom-right-radius:18px;font-size:12px;font-weight:700;z-index:2}
  .pc-code{position:absolute;right:14px;bottom:12px;font-size:12px;font-weight:700;color:rgba(255,255,255,.9);z-index:2}
  .pc-hint{position:absolute;left:14px;bottom:12px;font-size:11px;color:rgba(255,255,255,.85);z-index:2;transition:opacity .6s}
  .pc-name{font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:40px;line-height:1.1;margin:16px 2px 2px;letter-spacing:-.01em;word-break:break-all}
  .pc-sub{font-size:14px;color:#4a4d45;margin:0 2px 12px}
  .pc-specs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #222}
  .pc-list{padding:6px 10px 0 2px;border-right:1px solid #222}
  .pc-sl{padding:6px 2px 0 12px}
  .pc-r{height:21px;display:flex;align-items:center;font-size:10.5px;font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
  .pc-r .l{flex:none}.pc-r .d{flex:1;border-bottom:1px dotted #9a9a9a;margin:0 6px;transform:translateY(3px)}.pc-r .v{flex:none}
  .pc-s{height:21px;position:relative}
  .pc-s.on::before{content:"";position:absolute;left:0;right:0;top:12px;border-top:1.4px solid #222}
  .pc-s i{position:absolute;top:8px;width:9px;height:9px;background:#141414;transform:translateX(-50%)}
  .modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9;padding:24px}
  .modal.on{display:flex}
  .modal .in{background:var(--paper);border-radius:16px;padding:18px;max-width:460px;width:100%;max-height:92vh;overflow:auto}
  .modal img{width:100%;display:block;border-radius:8px}
  @media (max-width:900px){.lab{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><div class="kicker mono">DIDIM · Sasang Constitution Test</div><label class="langsel"><span aria-hidden="true">🌐</span><select id="langTop"></select></label></div>
  <header><h1 id="tTitle"></h1><p id="tDesc"></p></header>
  <main class="lab">
    <div>
      <div class="stage" id="stageBox">
        <div class="frame">
          <canvas id="live" width="600" height="600"></canvas>
          <video id="video" playsinline muted autoplay></video>
          <div class="guide" id="guide"></div>
          <div class="count" id="count"></div>
          <div class="flash" id="flash"></div>
        </div>
        <span class="phase mono" id="phase"></span>
        <div class="shares" id="liveShares"></div>
      </div>
      <div class="cardwrap" id="cardWrap"></div>
    </div>
    <div class="panel" id="panel"></div>
  </main>
  <footer id="tPrivacy"></footer>
</div>
<input id="fileIn" type="file" accept="image/*" capture="user" hidden>
<div class="modal" id="modal"><div class="in">
  <img id="modalImg" alt="profile card">
  <p class="note" style="margin:12px 2px 10px">⬇︎ Long-press or right-click to save.</p>
  <button class="btn" id="modalClose">OK</button>
</div></div>
<script>
/* ============ export ============ */
let FRAMED=true;try{FRAMED=window.self!==window.top;}catch(_){FRAMED=true;}
async function saveFile(name,getData,previewUrl){
  if(!FRAMED){const blob=await getData(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return;}
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(_){dl=null;}
  if(dl){try{await dl.save({filename:name,data:await getData()});return;}catch(e){if(e&&e.code==='declined')return;}}
  if(previewUrl){document.getElementById('modalImg').src=previewUrl;document.getElementById('modal').classList.add('on');}
}
/* ============ constants ============ */
const TAU=Math.PI*2, G=16, LV=6;
const PAPER='#F5F3EC', PAPER_RGB=[245,243,236], INK=[20,20,20];
const ORDER=['TE','SE','SY','TY'];
const TYPES={
  TE:{ko:'태음인',dir:'흩다',qi:'호산지기',desc:'밖으로 흩어 내보내는 방향',color:'#FF7A1A',pat:'흩어진 점 — 조각 중심에서 바깥으로 밀려나며 커지는 점',motion:'바깥으로 퍼지는 나선'},
  SE:{ko:'소음인',dir:'데우다',qi:'양난지기',desc:'온기를 더해 감싸는 방향',color:'#F23A6B',pat:'동심원 고리 — 한 점을 여러 겹으로 감싸는 고리',motion:'여러 겹이 번갈아 감싸 도는 고리'},
  SY:{ko:'소양인',dir:'식히다',qi:'음청지기',desc:'맑고 서늘하게 식히는 방향',color:'#2C4DF5',pat:'하프톤 선 — 간격이 넓고 곧은 서늘한 선',motion:'맑은 6방향 결정'},
  TY:{ko:'태양인',dir:'모으다',qi:'흡취지기',desc:'안으로 모아들이는 방향',color:'#7A3CF0',pat:'모이는 삼각형 — 조각 중심을 가리키며 안쪽일수록 커짐',motion:'중심으로 모이는 소용돌이'},
};
const PM={TE:{exp:0.55,spin:0.035},SE:{exp:1.0,spin:0.012},SY:{exp:1.0,spin:0.02},TY:{exp:1.9,spin:-0.04}};

const QS=[
 {cat:'기본',q:'성별을 선택해 주세요',opts:[['여성',[]],['남성',[]],['응답하지 않음',[]]]},
 {cat:'체형',q:'나의 체형은 어느 쪽에 가까운가요?',opts:[['체격이 크고 살집이 있는 편',['TE']],['어깨·목·머리 쪽이 발달하고 허리·하체가 가는 편',['TY']],['균형 잡힌 보통 체형',['SY']],['마르고 아담한 편',['SE']]]},
 {cat:'성격',q:'평소 나의 성격은?',opts:[['대범하고 통이 크다',['TE','SY']],['보통이다',[]],['섬세하고 꼼꼼하다',['SE']]]},
 {cat:'성격',q:'행동이나 말의 속도는?',opts:[['빠르고 급한 편',['SY','TY']],['보통',[]],['느리고 차분한 편',['TE','SE']]]},
 {cat:'성격',q:'평소 활동량과 에너지는?',opts:[['활동적이고 가만히 못 있는다',['SY']],['보통',[]],['조용하고 정적인 편',['SE']]]},
 {cat:'성격',q:'사람들과 있을 때 나는?',opts:[['외향적·사교적, 금방 친해진다',['SY']],['막힘없이 소통하고 자연스럽게 사람을 이끈다',['TY']],['보통',[]],['내성적, 혼자가 편하다',['SE']]]},
 {cat:'성격',q:'나의 기질에 더 가까운 쪽은?',opts:[['과감하고 추진력이 강해 뜻한 바는 밀어붙인다',['TY']],['묵직하고 끈기 있게 버틴다',['TE']],['보통',[]],['부드럽고 배려심이 많다',['SE']]]},
 {cat:'성격',q:'감정 표현은?',opts:[['쉽게 달아오르지만 금방 식는다',['SY']],['화가 나면 크게 치밀어 오른다',['TY']],['보통',[]],['좀처럼 드러내지 않는다',['TE','SE']]]},
 {cat:'소증',q:'평소 소화는?',opts:[['무엇을 먹어도 잘 소화된다',['TE']],['보통',[]],['자주 더부룩하고 체한다',['SE']]]},
 {cat:'소증',q:'평소 식욕은?',opts:[['늘 왕성하다',['TE']],['보통',[]],['입이 짧다',['SE']]]},
 {cat:'소증',q:'땀은 얼마나 흘리나요?',opts:[['조금만 움직여도 많이',['TE']],['보통',[]],['거의 안 난다',['SE']]]},
 {cat:'소증',q:'땀을 흘린 뒤 느낌은?',opts:[['개운하고 상쾌하다',['TE']],['별 차이 없다',[]],['지치고 기운이 빠진다',['SE']]]},
 {cat:'소증',q:'추위와 더위 중 더 힘든 것은?',opts:[['더위',['TE','SY']],['비슷하다',[]],['추위, 손발이 차다',['SE']]]},
 {cat:'소증',q:'물은 어떤 걸 더 찾나요?',opts:[['시원한 물·얼음물',['TE','SY']],['상관없다',[]],['따뜻한 물',['SE']]]},
 {cat:'소증',q:'오래 걷거나 서 있으면?',opts:[['다리·허리에 힘이 빨리 풀린다',['TY']],['보통',[]],['하체가 튼튼해 오래 버틴다',['TE']]]},
 {cat:'소증',q:'평소 소변은?',opts:[['양이 많고 시원하게 잘 나온다',['TY']],['보통',[]],['자주 마렵거나 시원하지 않다',['SE']]]},
];
const T=QS.length;
const MAXES=(()=>{const m={TE:0,SE:0,SY:0,TY:0};QS.forEach(q=>{const s=new Set();q.opts.forEach(o=>o[1].forEach(t=>s.add(t)));s.forEach(t=>m[t]++);});return m;})();

const PEOPLE=[
 {id:'A',name:'응답자 A',a:[1,0,0,2,1,2,1,3,0,0,0,0,0,0,2,1]},
 {id:'B',name:'응답자 B',a:[0,2,0,0,0,0,2,0,1,0,1,1,0,0,1,1]},
 {id:'C',name:'응답자 C',a:[0,3,2,2,2,3,3,3,2,2,2,2,2,2,1,2]},
 {id:'D',name:'응답자 D',a:[1,1,1,0,0,1,0,1,1,1,2,1,1,1,0,0]},
];

/* ============ utils ============ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const hex2rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixRGB=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const rgbStr=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const tone=(L,intr,f)=>clamp((1-L)*f+intr*(1-f),0,1);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function circ(p,x,y,r){p.moveTo(x+r,y);p.arc(x,y,r,0,TAU);}

/* ============ face ============ */
let FACE=null;
function proceduralFace(){
  const S=512,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
  const bg=g.createLinearGradient(0,0,S,S);bg.addColorStop(0,'#d8e0d9');bg.addColorStop(1,'#93a89c');g.fillStyle=bg;g.fillRect(0,0,S,S);
  g.filter='blur(2.5px)';
  g.fillStyle='#2f5f7a';g.beginPath();g.ellipse(S*.5,S*1.04,S*.5,S*.28,0,0,TAU);g.fill();
  const ng=g.createLinearGradient(S*.4,0,S*.6,0);ng.addColorStop(0,'#9c6e56');ng.addColorStop(1,'#d7a88c');g.fillStyle=ng;g.fillRect(S*.41,S*.58,S*.18,S*.22);
  g.fillStyle='#24180f';g.beginPath();g.ellipse(S*.5,S*.39,S*.25,S*.3,0,0,TAU);g.fill();
  const fg=g.createRadialGradient(S*.56,S*.41,S*.02,S*.5,S*.46,S*.25);fg.addColorStop(0,'#f6dccb');fg.addColorStop(.6,'#dcae92');fg.addColorStop(1,'#8f5e48');
  g.fillStyle=fg;g.beginPath();g.ellipse(S*.5,S*.46,S*.19,S*.245,0,0,TAU);g.fill();
  g.fillStyle='#24180f';g.beginPath();g.ellipse(S*.46,S*.255,S*.22,S*.09,-.28,0,TAU);g.fill();
  g.globalAlpha=.35;g.fillStyle='#5a3626';g.beginPath();g.ellipse(S*.355,S*.48,S*.055,S*.2,0,0,TAU);g.fill();g.globalAlpha=1;
  g.strokeStyle='#3a2a20';g.lineWidth=S*.014;g.lineCap='round';
  g.beginPath();g.moveTo(S*.39,S*.378);g.quadraticCurveTo(S*.43,S*.362,S*.47,S*.374);g.stroke();

    p.innerHTML=`<div class="meta mono"><span>${esc(u.cats[CAT_IDX[QS[i].cat]])}</span><span>${String(i+1).padStart(2,'0')} / ${T}</span></div><div class="prog"><i style="width:${i/T*100}%"></i></div>
      <h3>${esc(q[0])}</h3><div class="opts">${q[1].map((o,j)=>`<button data-j="${j}">${esc(o)}</button>`).join('')}</div>
      <div class="row"><button class="btn ghost" id="prev" ${i===0?'disabled':''}>${esc(u.prev)}</button></div>`;
    p.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>this.answer(+b.dataset.j));
    $('prev').onclick=()=>{if(this.ans.length){this.snapshot();this.ans.pop();this.renderQuestion();}};},
  answer(j){this.snapshot();this.ans.push(j);if(this.ans.length>=T){this.tb=null;this.tbPair=tiePair(this.ans);if(this.tbPair)this.renderQuestion();else this.finish();}else this.renderQuestion();},
  /* ---- result ---- */
  showStage(on){$('stageBox').style.display=on?'block':'none';$('cardWrap').style.display=on?'none':'flex';if(on&&this.g3){this.g3.stop();this.g3=null;}},
  stats(){const a=this.ans,f=(x,y)=>clamp(.5+.25*((a[x]===0)-(a[x]===2)+(a[y]===0)-(a[y]===2)),0,1);
    return {heat:f(12,13),dig:f(8,9),sweat:f(10,11),energy:f(3,4)};},
  finish(){this.tbPair=null;const m=buildModel(this.ans,this.tb);this.model=m;this.setPhase('result',5);
    const r=[...ORDER].sort((a,b)=>m.shares[b]-m.shares[a]);this.gap=m.shares[r[0]]-m.shares[r[1]];this.stars=this.tb?1:STAR(this.gap);
    const pc=document.createElement('canvas');pc.width=pc.height=600;drawPatch(pc.getContext('2d'),600,m,true);this.patchC=pc;
    const h=FACE.hash;this.code=`${100+h%900}.${10+(h>>>10)%90}.${10+(h>>>17)%90}`;
    this.showStage(false);this.buildCard();this.renderResult();},
  buildCard(){const m=this.model,tr=this.tr,d=m.dominant,ty=TYPES[d],st=this.stats(),sh=m.shares,year=new Date().getFullYear();
    const rows=[['TYPE',LATIN[d],null],['FLOW',FLOW[d],null],...[...ORDER].sort((a,b)=>sh[b]-sh[a]).map(t=>[LATIN[t],Math.round(sh[t]*100)+'%',sh[t]]),
      ['HEAT',st.heat.toFixed(2),st.heat],['DIGESTION',st.dig.toFixed(2),st.dig],['SWEAT',st.sweat.toFixed(2),st.sweat],['ENERGY',st.energy.toFixed(2),st.energy],
      ['AGE',this.user.age,null],['ORIGIN',flag(this.user.cc)+' '+this.user.cc,null],['CONFIDENCE','★'.repeat(this.stars)+'☆'.repeat(3-this.stars),Math.min(1,this.gap/.5)]];
    this.rows=rows;
    $('cardWrap').innerHTML=`<div class="pcard"><div class="pc-vis" id="pcVis" style="background:linear-gradient(180deg,${ty.color} 0%,${lighten(ty.color,.5)} 100%)">
      <span class="pc-tab mono">${year}</span><span class="pc-code mono">${this.code}</span><span class="pc-hint">${esc(tr.ui.drag)}</span></div>
      <div class="pc-name">${esc(this.user.name)}</div><div class="pc-sub">${esc(tr.types[d][1])} · ${esc(tr.types[d][0])}</div>
      <div class="pc-specs"><div class="pc-list">${rows.map(r=>`<div class="pc-r"><span class="l">${r[0]}</span><span class="d"></span><span class="v">${esc(r[1])}</span></div>`).join('')}</div>
      <div class="pc-sl">${rows.map(r=>r[2]==null?'<div class="pc-s"></div>':`<div class="pc-s on"><i style="left:${(4+92*r[2]).toFixed(1)}%"></i></div>`).join('')}</div></div></div>`;
    const vis=$('pcVis');this.g3=make3D(vis,m,this.patchC);
    if(!this.g3){const c=document.createElement('canvas');c.width=c.height=600;c.style.cssText='width:100%;height:100%;display:block';vis.appendChild(c);const mo=new Morph(c);mo.setSource(m);this.fallMo=mo;this.fallT0=performance.now();}
  },
  renderResult(){const tr=this.tr,u=tr.ui,m=this.model,d=m.dominant,ty=TYPES[d],tt=tr.types[d];
    if($('cardWrap').querySelector('.pc-sub')){$('cardWrap').querySelector('.pc-sub').textContent=`${tt[1]} · ${tt[0]}`;const h=$('cardWrap').querySelector('.pc-hint');if(h)h.textContent=u.drag;}
    $('panel').innerHTML=`<div class="meta mono"><span>RESULT</span><span>${esc(this.user.name)}</span></div><div class="prog"><i style="width:100%"></i></div>
      <div class="result-card" style="background:${ty.color}1f"><div class="k mono">${esc(u.resultK)}</div><h3 style="color:${ty.color}">${esc(tt[1])} · ${esc(tt[0])}</h3>
      <p>${esc(tt[2])}.</p><p style="margin-top:6px">${esc(u.resultP.replace('{motion}',tt[3]))}</p>
      <div class="stars">${esc(u.conf)} ${'★'.repeat(this.stars)}${'☆'.repeat(3-this.stars)}</div>${this.tb?`<p style="margin-top:6px;font-size:12.5px">${esc(u.tbNote)}</p>`:''}</div>
      ${sharesHTML(m.shares,tr)}${this.g3?'':`<p class="note" style="margin-top:10px">${esc(u.fallback3d)}</p>`}
      <div class="row"><button class="btn primary" id="save">${esc(u.save)}</button><button class="btn" id="replay">${esc(u.replay)}</button><button class="btn ghost" id="again">${esc(u.again)}</button></div>`;
    $('replay').onclick=()=>{if(this.g3)this.g3.replay();else this.fallT0=performance.now();};
    $('again').onclick=()=>{this.showStage(true);this.toCamera();};
    $('save').onclick=async()=>{const c=await this.makeCard();saveFile(`DIDIM_${LATIN[d]}_${this.user.name||'card'}.png`,()=>new Promise(res=>c.toBlob(res,'image/png')),c.toDataURL('image/png'));};},
  async makeCard(){try{await document.fonts.ready;}catch(_){}
    const m=this.model,d=m.dominant,ty=TYPES[d],tt=this.tr.types[d],W=1200,H=40+1180+262+this.rows.length*52+110,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
    const F='"Noto Sans KR",sans-serif',M='"JetBrains Mono",monospace';
    g.fillStyle='#fff';g.fillRect(0,0,W,H);
    const px=40,py=40,pw=W-80,ph=1180;g.save();g.beginPath();g.roundRect(px,py,pw,ph,56);g.clip();
    const gr=g.createLinearGradient(0,py,0,py+ph);gr.addColorStop(0,ty.color);gr.addColorStop(1,lighten(ty.color,.5));g.fillStyle=gr;g.fillRect(px,py,pw,ph);
    if(this.g3)await this.g3.ready();const src=this.g3?this.g3.snapshot():$('pcVis').querySelector('canvas');if(src){const s=Math.min(pw/src.width,ph/src.height),dw=src.width*s,dh=src.height*s;g.drawImage(src,px+(pw-dw)/2,py+(ph-dh)/2,dw,dh);}
    g.restore();
    g.fillStyle='#fff';g.beginPath();g.moveTo(px,py);g.lineTo(px+230,py);g.quadraticCurveTo(px+230,py+86,px+230-0,py+86);g.lineTo(px+56,py+86);g.lineTo(px,py+86);g.closePath();
    g.beginPath();g.roundRect(px-10,py-10,250,100,[0,0,48,0]);g.fill();
    g.fillStyle='#141414';g.font=`700 32px ${M}`;g.textAlign='left';g.fillText(String(new Date().getFullYear()),px+22,py+56);
    g.fillStyle='rgba(255,255,255,.92)';g.textAlign='right';g.font=`700 30px ${M}`;g.fillText(this.code,px+pw-36,py+ph-34);
    g.textAlign='left';g.fillStyle='#141414';let fs=120;g.font=`900 ${fs}px ${F}`;while(g.measureText(this.user.name).width>W-90&&fs>50){fs-=6;g.font=`900 ${fs}px ${F}`;}g.fillText(this.user.name,44,py+ph+150);
    g.fillStyle='#4a4d45';g.font=`500 38px ${F}`;g.fillText(`${tt[1]} · ${tt[0]}`,48,py+ph+214);
    const top=py+ph+262,rh=52,colX=W/2;g.strokeStyle='#222';g.lineWidth=3;g.beginPath();g.moveTo(40,top);g.lineTo(W-40,top);g.moveTo(colX,top);g.lineTo(colX,top+this.rows.length*rh+20);g.stroke();
    this.rows.forEach((r,i)=>{const y=top+30+i*rh;g.font=`600 26px ${M}`;g.fillStyle='#141414';g.textAlign='left';g.fillText(r[0],44,y);g.textAlign='right';g.fillText(r[1],colX-26,y);
      const lw=g.measureText(r[1]).width;g.textAlign='left';const lx=44+g.measureText(r[0]).width+14,rx=colX-26-lw-14;g.setLineDash([3,6]);g.strokeStyle='#9a9a9a';g.lineWidth=2;g.beginPath();g.moveTo(lx,y-6);g.lineTo(rx,y-6);g.stroke();g.setLineDash([]);
      if(r[2]!=null){const sx=colX+34,sw=W-40-sx-10;g.strokeStyle='#222';g.lineWidth=3;g.beginPath();g.moveTo(sx,y-8);g.lineTo(sx+sw,y-8);g.stroke();g.fillStyle='#141414';g.fillRect(sx+sw*(.04+.92*r[2])-11,y-19,22,22);}});
    g.fillStyle='#8a8d83';g.font=`400 22px ${F}`;g.textAlign='left';g.fillText(this.tr.ui.disclaimer,44,H-30);
    return c;},
  /* ---- loop ---- */
  tick(now){const ctx=this.ctx,S=this.S;
    if(this.phase==='gray'){const t=(now-this.t0)/1000;ctx.globalAlpha=1;ctx.drawImage(FACE.src,0,0,S,S);ctx.globalAlpha=ease(clamp((t-.3)/1.3,0,1));ctx.drawImage(this.grayC,0,0);ctx.globalAlpha=1;
      if(t>2.2){this.loadStep=2;this.setPhase('half',3);this.t0=now;this.renderLoading();}}
    else if(this.phase==='half'){const t=(now-this.t0)/1000,k=ease(clamp(t/2,0,1)),y=S*k;ctx.drawImage(this.grayC,0,0);ctx.save();ctx.beginPath();ctx.rect(0,0,S,y);ctx.clip();ctx.drawImage(this.halfC,0,0);ctx.restore();
      if(k<1){ctx.fillStyle='rgba(30,75,46,.85)';ctx.fillRect(0,y-2,S,3);}
      if(t>2.6){this.setPhase('q',4);this.drawPatchNow();this.renderQuestion();}}
    else if(this.phase==='q'&&this.fadeT0){const k=(now-this.fadeT0)/380;this.drawPatchNow();if(k<1){ctx.globalAlpha=1-ease(k);ctx.drawImage(this.prev,0,0);ctx.globalAlpha=1;}else this.fadeT0=0;}
    else if(this.phase==='result'&&this.fallMo&&!this.g3){const t=(now-this.fallT0)/1000,e=t<.4?0:t<3.2?ease((t-.4)/2.8):1;this.fallMo.frame(e,this.fallMo.P.spin*Math.max(0,t-.4));}
    requestAnimationFrame(n=>this.tick(n));},
};
app.init();requestAnimationFrame(n=>app.tick(n));
</script>
